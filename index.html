<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Calculator with History</title>
    <link rel="stylesheet" href="style_v2.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.11.0/math.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gradient-to-br from-slate-900 via-blue-900 to-slate-900 min-h-screen text-white transition-colors duration-300">
    <div class="container mx-auto px-4 py-8 max-w-6xl">
        <!-- Header -->
        <div class="text-center mb-8">
            <h1 class="text-3xl md:text-4xl font-bold bg-gradient-to-r from-cyan-400 to-blue-500 bg-clip-text text-transparent mb-4">
                Advanced Calculator
            </h1>
            <div class="flex justify-center gap-4">
                <button id="themeToggle" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 rounded-lg transition-colors duration-200">
                    🌙 Dark
                </button>
                <button id="modeToggle" class="px-4 py-2 bg-green-600 hover:bg-green-700 rounded-lg transition-colors duration-200">
                    Basic
                </button>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <!-- Calculator Section -->
            <div class="lg:col-span-2">
                <div class="bg-slate-800 rounded-3xl p-6 shadow-2xl border border-blue-700">
                    <!-- Display -->
                    <div class="mb-6">
                        <div id="previousDisplay" class="text-right text-blue-300 text-sm h-5 overflow-hidden"></div>
                        <input
                            type="text"
                            id="display"
                            class="w-full text-right text-3xl p-4 rounded-xl bg-slate-700 border-2 border-blue-500 outline-none text-cyan-100 font-mono"
                            readonly
                        />
                    </div>

                    <!-- Basic Buttons -->
                    <div class="grid grid-cols-4 gap-3 mb-4">
                        <button class="btn btn-action" data-key="clear">C</button>
                        <button class="btn btn-action" data-key="backspace">⌫</button>
                        <button class="btn btn-operator" data-key="%">%</button>
                        <button class="btn btn-operator" data-key="/">÷</button>

                        <button class="btn btn-number" data-key="7">7</button>
                        <button class="btn btn-number" data-key="8">8</button>
                        <button class="btn btn-number" data-key="9">9</button>
                        <button class="btn btn-operator" data-key="*">×</button>

                        <button class="btn btn-number" data-key="4">4</button>
                        <button class="btn btn-number" data-key="5">5</button>
                        <button class="btn btn-number" data-key="6">6</button>
                        <button class="btn btn-operator" data-key="-">-</button>

                        <button class="btn btn-number" data-key="1">1</button>
                        <button class="btn btn-number" data-key="2">2</button>
                        <button class="btn btn-number" data-key="3">3</button>
                        <button class="btn btn-operator" data-key="+">+</button>

                        <button class="btn btn-number col-span-2" data-key="0">0</button>
                        <button class="btn btn-number" data-key=".">.</button>
                        <button class="btn btn-equals" data-key="=">=</button>
                    </div>

                    <!-- Scientific Buttons -->
                    <div id="scientificButtons" class="grid grid-cols-4 gap-3 hidden">
                        <button class="btn btn-scientific" data-key="sqrt">√</button>
                        <button class="btn btn-scientific" data-key="square">x²</button>
                        <button class="btn btn-scientific" data-key="cube">x³</button>
                        <button class="btn btn-scientific" data-key="power">x^y</button>

                        <button class="btn btn-scientific" data-key="sin">sin</button>
                        <button class="btn btn-scientific" data-key="cos">cos</button>
                        <button class="btn btn-scientific" data-key="tan">tan</button>
                        <button class="btn btn-scientific" data-key="log">log</button>

                        <button class="btn btn-scientific" data-key="ln">ln</button>
                        <button class="btn btn-scientific" data-key="pi">π</button>
                        <button class="btn btn-scientific" data-key="e">e</button>
                        <button class="btn btn-scientific" data-key="factorial">n!</button>
                    </div>
                </div>
            </div>

            <!-- History Section -->
            <div class="lg:col-span-1">
                <div class="bg-slate-800 rounded-3xl p-6 shadow-2xl border border-blue-700 h-full flex flex-col">
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="text-xl font-semibold text-cyan-300">History</h2>
                        <button id="clearHistory" class="px-3 py-1 bg-red-600 hover:bg-red-700 rounded text-sm transition-colors">
                            Clear
                        </button>
                    </div>
                    <div id="history" class="flex-1 overflow-y-auto space-y-2 p-2 bg-slate-700 rounded-lg">
                        <p class="text-blue-300 text-center py-4">No calculations yet</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Keyboard Shortcuts -->
        <div class="text-center mt-6 text-blue-300 text-sm">
            <button id="helpBtn" class="hover:text-cyan-300 underline">
                Keyboard shortcuts available ⌨️
            </button>
        </div>
    </div>

    <!-- Help Modal -->
    <div id="helpModal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-slate-800 rounded-2xl p-6 max-w-md w-full border border-blue-700">
            <h3 class="text-xl font-semibold mb-4 text-cyan-300">Keyboard Shortcuts</h3>
            <div class="space-y-2 text-sm text-blue-100">
                <p><kbd class="bg-slate-700 px-2 py-1 rounded">0-9</kbd> Numbers</p>
                <p><kbd class="bg-slate-700 px-2 py-1 rounded">+, -, *, /</kbd> Operations</p>
                <p><kbd class="bg-slate-700 px-2 py-1 rounded">Enter/=</kbd> Calculate</p>
                <p><kbd class="bg-slate-700 px-2 py-1 rounded">Backspace</kbd> Delete</p>
                <p><kbd class="bg-slate-700 px-2 py-1 rounded">Escape/C</kbd> Clear</p>
                <p><kbd class="bg-slate-700 px-2 py-1 rounded">Ctrl+T</kbd> Toggle theme</p>
                <p><kbd class="bg-slate-700 px-2 py-1 rounded">Ctrl+M</kbd> Toggle mode</p>
                <p><kbd class="bg-slate-700 px-2 py-1 rounded">Ctrl+L</kbd> Clear history</p>
            </div>
            <button id="closeModal" class="mt-4 w-full bg-blue-600 hover:bg-blue-700 py-2 rounded-lg">
                Close
            </button>
        </div>
    </div>

    <script src="script_v2.js"></script>
</body>
</html>
